name: "Ruby on Rails CI"
on:
  push:
    branches: ["**"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Security audit dependencies
        run: bin/bundler-audit --update

      - name: Security audit application code
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Lint Ruby files
        run: bin/rubocop --parallel

      - name: Lint ERuby files
        run: bin/erblint -la

  test:
    # if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: rails
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: rails
      CAPYBARA_DRIVER: selenium_chrome_headless
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up database schema
        run: bin/rails db:prepare

      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Run fast correctness specs
        run: COVERAGE=true COVERAGE_RESET=true COVERAGE_COMMAND_NAME=rspec-fast RSPEC_PROFILE_PATH=tmp/ci-rspec-fast.json bin/specs fast

      - name: Run feature specs
        run: COVERAGE=true COVERAGE_COMMAND_NAME=rspec-feature RSPEC_PROFILE_PATH=tmp/ci-rspec-feature.json bin/specs feature

      - name: Run operational specs
        run: COVERAGE=true COVERAGE_COMMAND_NAME=rspec-operational RSPEC_PROFILE_PATH=tmp/ci-rspec-operational.json bin/specs operational

      - name: Preserve RSpec timing and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-performance-and-coverage
          path: |
            tmp/ci-rspec-*.json
            coverage/
