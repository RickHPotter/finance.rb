      exchange_trio:
        title: "Trio de Câmbio e Cadeia de Referências"
        description: "Verifica a topologia de câmbio entre usuários conectados e as referências canônicas das transações."
      exchange_return:
        title: "Integridade de Retorno de Câmbio"
        description: "Verifica totais, alocações, origens vinculadas e projeções de repetição dos retornos."
      card_exchange_projection:
        title: "Projeções de Câmbio Vinculadas ao Cartão"
        description: "Verifica as linhas de câmbio do pagador contra as projeções atuais das parcelas do cartão."
      misplaced_exchange_intent:
        title: "Intenção Incorreta de Empréstimo/Reembolso"
        description: "Encontra origens de câmbio cuja intenção persistida diverge do comportamento financeiro."
      piggy_bank:
        title: "Integridade do Cofrinho"
        description: "Verifica relacionamentos de aportes, projeções de retorno, avaliações e parcelas."
    states:
      healthy: "Saudável"
      warning: "Alerta"
      failing: "Falhando"
      running: "Executando"
      unavailable: "Indisponível"
    reasons:
      never_run: "Nunca executada"
      unavailable: "A execução mais recente está indisponível."
    fields:
      status: "Estado"
      affected: "Afetados"
      failures: "Falhas"
      warnings: "Alertas"
      repairable: "Reparáveis"
      read_only: "Somente leitura"
      last_run: "Última execução"
      duration: "Duração"
      scope: "Escopo"
    scopes:
      context: "Contexto selecionado"
      context_with_connections: "Contexto selecionado e usuários conectados"
    values:
      no_value: "—"
      milliseconds: "%{count} ms"
      repair_available: "Reparos compatíveis disponíveis"
      diagnostic_only: "Somente diagnóstico"
