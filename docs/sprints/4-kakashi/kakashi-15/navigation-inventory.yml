legacy_history_shim:
  path: app/javascript/controllers/application.js
  classification: remove
  slice: 10
  markers:
    - HISTORY MANAGEMENT
    - currentFrameUrl
    - historyStack
    - updateHistory
    - 'url.searchParams.set("format", "turbo_stream")'
