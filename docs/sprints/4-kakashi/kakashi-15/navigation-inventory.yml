center_container_replacements:
  - paths:
      - app/controllers/cash_installments_controller.rb
      - app/controllers/cash_transactions_controller.rb
    expected_occurrences: 5
    classification: in_place_stream
    slice: 2
  - paths:
      - app/controllers/card_transactions_controller.rb
      - app/views/card_transactions/pay_in_advance.turbo_stream.erb
    expected_occurrences: 3
    classification: in_place_stream
    slice: 3
  - paths:
      - app/controllers/budgets_controller.rb
    expected_occurrences: 1
    classification: in_place_stream
    slice: 4
  - glob: app/views/cash_transactions/*.turbo_stream.erb
    expected_occurrences: 10
    classification: top_level_drive
    slice: 2
  - paths:
      - app/views/card_transactions/create.turbo_stream.erb
      - app/views/card_transactions/destroy.turbo_stream.erb
      - app/views/card_transactions/edit.turbo_stream.erb
